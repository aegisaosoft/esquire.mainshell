<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esquire</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; font-family: Arial, sans-serif; }
    body { background: #0F172A; overflow: hidden; }

    .esq-spinner {
      width: 32px; height: 32px;
      border: 3px solid #2D3A5E;
      border-top-color: #2E74B5;
      border-radius: 50%;
      animation: esq-spin 0.7s linear infinite;
    }
    @keyframes esq-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
